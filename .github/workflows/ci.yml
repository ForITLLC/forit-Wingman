name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "appcast.xml"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Wingman
  PROJECT: Wingman.xcodeproj
  # 0.1.<run number> keeps every CI build uniquely versioned for Sparkle and for humans.
  APP_VERSION: 0.1.${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Unit tests (WingmanTests only; UI tests need a signed in desktop session)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=macOS" \
            -only-testing:WingmanTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee build/test.log | grep -E "^(Test|Executed|\*\*)|error:" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/test.log
          if-no-files-found: ignore

  build:
    name: build
    runs-on: macos-latest
    needs: test
    outputs:
      dmg_name: ${{ steps.dmg.outputs.dmg_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      # ENABLE_HARDENED_RUNTIME=NO is deliberate while the build has no Apple Team ID (ad-hoc or the
      # interim certificate below). The hardened
      # runtime turns on library validation, which only accepts libraries signed by the same
      # Team ID; an ad-hoc signature has no Team ID, so dyld refused the embedded
      # Sparkle.framework and every DMG from this job crashed at launch with "Library missing"
      # (2026-09-05, macOS 27 on Ben's MacBook). Put the hardened runtime back on when the
      # build is signed with a ForIT Developer ID, which is also what notarisation needs.
      # Interim signing identity (2026-09-05). macOS keys the Accessibility and Screen Recording grants
      # to the app's designated requirement. An ad-hoc signature's requirement is the build's cdhash,
      # so every release invalidated both grants on the Mac it was installed on. Signing with a
      # certificate makes the requirement "identifier io.forit.wingman and certificate root = H..."
      # (codesign writes "root" for a self-signed certificate, which is its own root, and "leaf"
      # for one issued by a CA; both name the certificate, and neither changes between builds)
      # which is the same for every build signed by that certificate, so the grants survive updates.
      # The certificate is self-signed and held as two repo secrets (MACOS_SIGNING_P12_BASE64, the
      # PKCS#12; MACOS_SIGNING_P12_PASSWORD). It is not a Developer ID: Gatekeeper still treats the
      # app as unidentified, exactly as with ad-hoc, and the hardened runtime stays off (see below).
      # Without the secrets the build falls back to ad-hoc signing. Replace with a ForIT Developer ID
      # when one exists; changing the certificate costs one more grant of each permission.
      - name: Import the interim signing certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "MACOS_SIGNING_P12_BASE64 / MACOS_SIGNING_P12_PASSWORD not set; building ad-hoc signed."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/wingman-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Self-signed: trust it for code signing so it counts as a valid identity on this runner.
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin "pass:$P12_PASSWORD" -nokeys -clcerts -out "$RUNNER_TEMP/signing.crt"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.crt"
          rm -f "$RUNNER_TEMP/signing.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/^ *1) \([0-9A-F]*\) .*/\1/p')
          if [ -z "$IDENTITY" ]; then
            echo "No valid code-signing identity after import:"
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Signing with certificate $IDENTITY"

      - name: Build Release (interim certificate; ad-hoc when the signing secrets are absent)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.identity }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            OTHER_CODE_SIGN_FLAGS=--timestamp=none \
            ENABLE_HARDENED_RUNTIME=NO \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee build/build.log | grep -E "^(\*\*|error:|Ld |CompileSwift)" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/build.log
          test -d build/DerivedData/Build/Products/Release/Wingman.app

      - name: Verify the bundle identity
        run: |
          APP=build/DerivedData/Build/Products/Release/Wingman.app
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Contents/Info.plist" | tee build/bundle-id.txt
          grep -qx "io.forit.wingman" build/bundle-id.txt
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleName" "$APP/Contents/Info.plist" | grep -qx "Wingman"
          codesign -dvv "$APP" 2>&1 | grep -E "Identifier|Signature|Authority|flags" || true
          codesign --verify --deep --strict "$APP"
          # The designated requirement is what macOS keys the Accessibility and Screen Recording grants
          # to. With the interim certificate it must name the certificate, not the build's cdhash,
          # or every release would invalidate the grants again.
          codesign -d -r- "$APP" 2>&1 | tee build/designated-requirement.txt
          if [ "${{ steps.signing.outputs.identity }}" != "-" ]; then
            grep -Eq "certificate (leaf|root)" build/designated-requirement.txt
            if grep -q "cdhash" build/designated-requirement.txt; then
              echo "Designated requirement still pins the cdhash; the grants would not survive an update."
              exit 1
            fi
          fi

      # The app must survive dyld: launch the built binary and require it to still be alive
      # eight seconds later. A signing or embedding mistake (the Sparkle case above) kills the
      # process within the first second, before any UI, so this catches it without a display.
      - name: Launch smoke test (the app must stay up for 8 seconds)
        run: |
          APP=build/DerivedData/Build/Products/Release/Wingman.app
          "$APP/Contents/MacOS/Wingman" > build/launch-smoke.log 2>&1 &
          WINGMAN_PID=$!
          sleep 8
          if kill -0 "$WINGMAN_PID" 2>/dev/null; then
            echo "Wingman stayed up for 8 seconds (pid $WINGMAN_PID)"
            kill "$WINGMAN_PID" || true
          else
            echo "Wingman exited within 8 seconds of launch"
            cat build/launch-smoke.log
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i wingman | head -1 | xargs -I{} sh -c 'head -c 4000 ~/Library/Logs/DiagnosticReports/{}' || true
            exit 1
          fi

      - name: Package DMG
        id: dmg
        run: |
          APP=build/DerivedData/Build/Products/Release/Wingman.app
          DMG_NAME="Wingman-$APP_VERSION.dmg"
          STAGING=build/dmg-staging
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Wingman" -srcfolder "$STAGING" -ov -format UDZO "build/$DMG_NAME"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          ls -la "build/$DMG_NAME"

      # Jamf deploys a .pkg, not a DMG: a component package that puts Wingman.app in /Applications,
      # with a postinstall that launches it for the person at the console. It is unsigned (there is
      # no Developer ID Installer certificate yet), which a Jamf policy accepts; an MDM install command
      # would not. The step then installs the package on the runner the way a policy does (installer
      # as root) and checks the copy in /Applications, so a broken package never reaches a release.
      - name: Package installer (.pkg for Jamf)
        id: pkg
        run: |
          APP=build/DerivedData/Build/Products/Release/Wingman.app
          PKG_NAME="Wingman-$APP_VERSION.pkg"
          PKG_ROOT=build/pkg-root
          rm -rf "$PKG_ROOT" && mkdir -p "$PKG_ROOT"
          cp -R "$APP" "$PKG_ROOT/"
          chmod +x packaging/pkg-scripts/postinstall
          # Installer "relocates" a bundle it considers relocatable onto any existing copy with the
          # same bundle id anywhere on the disk (here the DerivedData copy the smoke test launched; on
          # a Mac, a stray copy in Downloads), and pkgbuild marks app bundles relocatable by default.
          # The component plist pins the install to /Applications.
          pkgbuild --analyze --root "$PKG_ROOT" build/pkg-component.plist
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" build/pkg-component.plist
          /usr/libexec/PlistBuddy -c "Print :0:BundleIsRelocatable" build/pkg-component.plist | grep -qx false
          pkgbuild --root "$PKG_ROOT" \
            --component-plist build/pkg-component.plist \
            --install-location /Applications \
            --identifier io.forit.wingman.pkg \
            --version "$APP_VERSION" \
            --scripts packaging/pkg-scripts \
            "build/$PKG_NAME"
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          ls -la "build/$PKG_NAME"
          sudo installer -pkg "build/$PKG_NAME" -target / -verboseR 2>&1 | tail -5
          pkgutil --files io.forit.wingman.pkg | head -3
          ls -d /Applications/Wingman.app
          codesign --verify --deep --strict /Applications/Wingman.app
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" /Applications/Wingman.app/Contents/Info.plist | grep -qx "$APP_VERSION"
          pkgutil --pkg-info io.forit.wingman.pkg
          # The postinstall hands the bundle to the console user; a root-owned bundle can never be
          # updated silently by Sparkle, so the package must not leave one behind.
          CONSOLE_USER=$(stat -f "%Su" /dev/console)
          APP_OWNER=$(stat -f "%Su" /Applications/Wingman.app)
          echo "console user: $CONSOLE_USER, installed app owner: $APP_OWNER"
          if [ "$CONSOLE_USER" != "root" ] && [ "$CONSOLE_USER" != "loginwindow" ]; then
            test "$APP_OWNER" = "$CONSOLE_USER"
          fi
          # The postinstall launches the app for the console user; stop that copy before the job ends.
          sleep 3
          pkill -x Wingman || true

      - name: Upload .app, .dmg and .pkg
        uses: actions/upload-artifact@v4
        with:
          name: Wingman-${{ env.APP_VERSION }}
          path: |
            build/DerivedData/Build/Products/Release/Wingman.app
            build/${{ steps.dmg.outputs.dmg_name }}
            build/${{ steps.pkg.outputs.pkg_name }}
            build/designated-requirement.txt
            build/build.log
          if-no-files-found: error

      - name: Sign DMG for Sparkle and verify the signature independently
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY secret not set; skipping Sparkle signature."
            echo "sparkle_signed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          SPARKLE_BIN=$(find build/DerivedData/SourcePackages/artifacts -type d -path "*Sparkle*/bin" | head -1)
          test -n "$SPARKLE_BIN" || { echo "Sparkle bin not found"; exit 1; }
          DMG="build/${{ steps.dmg.outputs.dmg_name }}"
          KEY_FILE=$(mktemp)
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          "$SPARKLE_BIN/sign_update" -f "$KEY_FILE" "$DMG" > build/sparkle-signature.txt
          rm -f "$KEY_FILE"
          cat build/sparkle-signature.txt
          # Independent check: the signature must verify against the SUPublicEDKey shipped in Info.plist.
          PUBLIC_KEY=$(/usr/libexec/PlistBuddy -c "Print SUPublicEDKey" Wingman/Info.plist)
          SIGNATURE=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' build/sparkle-signature.txt)
          # The runner's Homebrew Python refuses system-wide installs (PEP 668), so use a venv.
          python3 -m venv build/pyvenv
          build/pyvenv/bin/python -m pip install --quiet cryptography
          build/pyvenv/bin/python - "$DMG" "$PUBLIC_KEY" "$SIGNATURE" <<'PY'
          import base64, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          dmg_path, public_key_b64, signature_b64 = sys.argv[1:4]
          Ed25519PublicKey.from_public_bytes(base64.b64decode(public_key_b64)).verify(
              base64.b64decode(signature_b64), open(dmg_path, "rb").read())
          print("Sparkle signature verifies against SUPublicEDKey")
          PY
          echo "sparkle_signed=true" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          DMG="build/${{ steps.dmg.outputs.dmg_name }}"
          PKG="build/${{ steps.pkg.outputs.pkg_name }}"
          gh release create "$TAG" "$DMG" "$PKG" build/designated-requirement.txt \
            --title "Wingman $APP_VERSION" \
            --notes "CI build from ${{ github.sha }}, signed with the interim ForIT certificate (not a Developer ID, not notarized: right-click > Open on the first launch of a DMG copy). The .pkg installs Wingman.app to /Applications for a Jamf policy (unsigned, so not for an MDM install command); designated-requirement.txt is the code requirement for the PPPC profile." \
            --target "${{ github.sha }}"

      - name: Update appcast.xml on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.sparkle_signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_NAME: ${{ steps.dmg.outputs.dmg_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          DMG_LENGTH=$(stat -f %z "build/$DMG_NAME")
          SIGNATURE=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' build/sparkle-signature.txt)
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          export DMG_LENGTH SIGNATURE PUBDATE
          python3 - <<'PY'
          import os
          version = os.environ["APP_VERSION"]
          build_number = os.environ["BUILD_NUMBER"]
          url = "https://github.com/%s/releases/download/v%s/%s" % (os.environ["REPOSITORY"], version, os.environ["DMG_NAME"])
          item = "\n".join([
              "        <item>",
              "            <title>%s</title>" % version,
              "            <pubDate>%s</pubDate>" % os.environ["PUBDATE"],
              "            <sparkle:version>%s</sparkle:version>" % build_number,
              "            <sparkle:shortVersionString>%s</sparkle:shortVersionString>" % version,
              "            <sparkle:minimumSystemVersion>14.2</sparkle:minimumSystemVersion>",
              '            <enclosure url="%s" length="%s" type="application/octet-stream" sparkle:edSignature="%s"/>'
              % (url, os.environ["DMG_LENGTH"], os.environ["SIGNATURE"]),
              "        </item>",
          ])
          path = "appcast.xml"
          xml = open(path).read()
          marker = "    </channel>"
          assert marker in xml
          open(path, "w").write(xml.replace(marker, item + "\n" + marker, 1))
          print(item)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Publish Wingman $APP_VERSION to appcast [skip ci]"
          git push origin HEAD:main
